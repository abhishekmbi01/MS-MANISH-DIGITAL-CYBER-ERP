<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login - MS MANISH ERP</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><div class="wrap nav"><div class="brand"><div class="logo-mark">MS</div><div><b>Customer Portal</b><div class="small">MS MANISH ERP v4</div></div></div><div class="navlinks"><a href="/">Public Portal</a><button id="logoutBtn" class="hidden">Logout</button></div></div></header>
<main class="wrap section"><div id="loginView" class="panel" style="max-width:480px;margin:auto"><h1>Login with Mobile OTP</h1><div class="field"><label>Mobile Number</label><input id="mobile" maxlength="10" inputmode="numeric" placeholder="10-digit mobile"></div><button id="otpBtn" class="btn btn-primary" style="width:100%;margin-top:12px">Send OTP</button><div id="otpBox" class="hidden" style="margin-top:12px"><div class="field"><label>OTP</label><input id="otp" maxlength="6" inputmode="numeric"></div><button id="verifyBtn" class="btn btn-good" style="width:100%;margin-top:10px">Verify & Login</button></div><div id="msg" style="margin-top:10px"></div></div>
<div id="portal" class="hidden"><div class="toolbar"><div><h1 id="welcome">My Works</h1><div class="muted" id="profile"></div></div><button class="btn btn-outline" onclick="loadAll()">Refresh</button></div><div id="stats" class="grid grid-4"></div><div class="grid grid-2" style="margin-top:14px"><div class="panel"><h2>My Work History</h2><div id="works"></div></div><div class="panel"><h2>Payment History</h2><div id="payments"></div></div></div><div class="panel" style="margin-top:14px"><h2>Complaint / Support Ticket</h2><form id="ticketForm" class="grid grid-2"><input name="subject" placeholder="Subject" required><select name="priority"><option>Normal</option><option>Urgent</option></select><textarea name="message" placeholder="Describe your issue" required style="grid-column:1/-1"></textarea><button class="btn btn-primary">Raise Ticket</button></form><div id="ticketMsg" style="margin-top:10px"></div><h3 style="margin-top:18px">My Tickets</h3><div id="tickets"></div></div></div></main><script src="/customer.js"></script></body></html>
