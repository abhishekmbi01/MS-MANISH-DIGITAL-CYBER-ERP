<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Receipt</title><link rel="stylesheet" href="/style.css"></head><body><div class="receipt"><h1 id="rShop">MS MANISH DIGITAL CYBER EXPERT</h1><div id="rAddress" style="text-align:center" class="muted"></div><hr><div id="receiptRows"></div><div class="actions" style="margin-top:20px"><button class="btn btn-primary" onclick="print()">🖨 Print / Save PDF</button><a class="btn btn-outline" href="/">Home</a></div></div><script>const q=new URLSearchParams(location.search),id=q.get('id'),mobile=q.get('mobile');fetch('/api/receipt/'+encodeURIComponent(id)+'?mobile='+encodeURIComponent(mobile)).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);rShop.textContent=j.shop.shopName;rAddress.textContent=j.shop.address+' • '+j.shop.phone;const rows=[['Work ID',j.id],['Date',new Date(j.createdAt).toLocaleString()],['Name',j.name],['Mobile',j.mobile],['Service',j.service],['Status',j.status],['Payment Status',j.paymentStatus],['Amount','₹'+Number(j.paymentAmount||0)],['Partner',j.partnerName?j.partnerName+' ('+j.partnerId+')':'Direct Customer'],['Note',j.adminNote||'-']];receiptRows.innerHTML=rows.map(x=>`<div class="row"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');}).catch(e=>receiptRows.innerHTML='<p>❌ '+e.message+'</p>');</script></body></html>
