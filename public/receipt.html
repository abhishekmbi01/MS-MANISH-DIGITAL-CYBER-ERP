<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Receipt</title><link rel="stylesheet" href="style.css"></head><body><div class="no-print" style="max-width:850px;margin:20px auto;display:flex;gap:10px"><button class="btn btn-primary" onclick="print()">🖨️ Print / Save PDF</button><a class="btn btn-outline" href="/">Back</a></div><main id="receipt" class="receipt"><div class="notice">Loading receipt...</div></main><script>
const p=new URLSearchParams(location.search),id=p.get('id')||'',mobile=p.get('mobile')||'',esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));fetch('/api/receipt/'+encodeURIComponent(id)+'?mobile='+encodeURIComponent(mobile)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);document.title=d.id+' Receipt';document.getElementById('receipt').innerHTML=`<div class="receipt-head"><div style="display:flex;gap:16px;align-items:center"><img src="assets/logo-original.jpeg"><div><h1 style="margin:0">${esc(d.shop.shopName)}</h1><p style="margin:5px 0">WORK / PAYMENT RECEIPT</p></div></div><div style="text-align:right"><b>${esc(d.id)}</b><br><small>${new Date(d.createdAt).toLocaleString()}</small></div></div><table><tr><td>Customer Name</td><td>${esc(d.name)}</td></tr><tr><td>Mobile</td><td>${esc(d.mobile)}</td></tr><tr><td>Service</td><td>${esc(d.service)}</td></tr><tr><td>Current Status</td><td><b>${esc(d.status)}</b></td></tr><tr><td>Total Fee</td><td><b>₹${Number(d.totalFee||0).toLocaleString('en-IN')}</b></td></tr><tr><td>Paid Amount</td><td><b>₹${Number(d.paidAmount||0).toLocaleString('en-IN')}</b></td></tr><tr><td>Due Amount</td><td><b>₹${Number(d.dueAmount||0).toLocaleString('en-IN')}</b></td></tr><tr><td>Payment Status</td><td>${esc(d.paymentStatus)}</td></tr><tr><td>Documents</td><td>${(d.files||[]).map(f=>esc(f.name)).join(', ')||'No documents attached'}</td></tr><tr><td>Customer Message</td><td>${esc(d.message||'-')}</td></tr><tr><td>Admin Note</td><td>${esc(d.adminNote||'-')}</td></tr></table><div style="margin-top:26px;padding:18px;background:#f6f7f9;border-radius:12px"><b>Contact</b><br>${esc(d.shop.phone)} • ${esc(d.shop.email)}<br>${esc(d.shop.address)}</div><p style="text-align:center;margin-top:30px;color:#667085">यह receipt work/payment record का प्रमाण है। Work ID सुरक्षित रखें।</p>`}).catch(e=>document.getElementById('receipt').innerHTML='<div class="error">'+esc(e.message)+'</div>');
</script></body></html>
