<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner Portal - MS MANISH ERP</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><div class="wrap nav"><div class="brand"><div class="logo-mark">MS</div><div><b>Partner / Cyber Portal</b><div class="small">MS MANISH ERP v4</div></div></div><div class="navlinks"><a href="/">Public Portal</a><button id="logoutBtn" class="hidden">Logout</button></div></div></header>
<main class="wrap section"><div id="loginView" class="panel" style="max-width:480px;margin:auto"><h1>Partner Login</h1><div class="field"><label>Partner ID</label><input id="partnerId" placeholder="MSP-0001"></div><div class="field" style="margin-top:10px"><label>PIN</label><input id="pin" type="password"></div><button id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:14px">Login</button><div id="loginMsg" style="margin-top:10px"></div></div>
<div id="portal" class="hidden"><div class="toolbar"><div><h1 id="welcome">Partner Dashboard</h1><div class="muted" id="partnerMeta"></div></div><div class="actions"><button class="btn btn-outline" onclick="loadAll()">Refresh</button><button class="btn btn-primary" onclick="printCard()">Print Partner Card</button></div></div><div id="stats" class="grid grid-4"></div><div class="grid grid-2" style="margin-top:14px"><div class="panel"><h2>Submit Customer Work</h2><form id="workForm" class="grid grid-2" enctype="multipart/form-data"><input name="name" placeholder="Customer name" required><input name="mobile" placeholder="10-digit mobile" required><select name="service" id="serviceSelect" required></select><select name="priority"><option>Normal</option><option>Urgent</option><option>Very Urgent</option></select><input name="paymentAmount" type="number" min="0" placeholder="Payment received"><input name="dueDate" type="date"><input name="documents" type="file" accept="image/*,.pdf" multiple><input name="paymentProof" type="file" accept="image/*,.pdf"><textarea name="message" placeholder="Message / instructions" style="grid-column:1/-1"></textarea><div id="serviceInfo" style="grid-column:1/-1" class="small muted"></div><button class="btn btn-primary">Submit Work</button></form><div id="submitMsg" style="margin-top:10px"></div></div><div class="panel"><h2>Partner Wallet</h2><div id="wallet"></div><hr style="border-color:#24415f"><h2>Partner ID Card</h2><div id="card"></div></div></div><div class="panel" style="margin-top:14px"><div class="toolbar"><h2>Track My Works</h2><input id="search" placeholder="Search Work ID / customer / status" style="max-width:320px"></div><div id="works"></div></div></div></main><script src="/partner.js"></script></body></html>
